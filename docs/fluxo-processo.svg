<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1340" font-family="Arial" viewBox="0 0 1040 1340">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="1040" height="1340" fill="#f8fafc"/>
<text x="40" y="48" font-size="26" font-weight="800" fill="#0f172a">Histocell — Fluxo do Processo</text>
<text x="40" y="74" font-size="14" fill="#64748b">Do pedido à expedição (passo a passo)</text>
<rect x="40" y="100" rx="14" ry="14" width="600" height="86" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><circle cx="66" cy="126" r="15" fill="#3b82f6"/><text x="66" y="131" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial">1</text><text x="92" y="130" font-size="17" font-weight="700" fill="#0f172a" font-family="Arial">PEDIDO</text><text x="92" y="152" font-size="13" fill="#475569" font-family="Arial">Cliente (Portal Web, link sem login)  OU  Recepção (Local)</text><text x="92" y="171" font-size="13" fill="#475569" font-family="Arial">Escolhe serviços · observações (nº dos casos do cliente)</text>
<line x1="340.0" y1="186" x2="340.0" y2="210" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="40" y="218" rx="14" ry="14" width="600" height="86" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/><circle cx="66" cy="244" r="15" fill="#06b6d4"/><text x="66" y="249" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial">2</text><text x="92" y="248" font-size="17" font-weight="700" fill="#0f172a" font-family="Arial">RECEBIMENTO · Etapa 1 — RECEPÇÃO</text><text x="92" y="270" font-size="13" fill="#475569" font-family="Arial">Registra o que chegou: recipientes (Pote / Caixa / Saco / Outro)</text><text x="92" y="289" font-size="13" fill="#475569" font-family="Arial">Não abre nem conta amostras · etiqueta o recipiente   grava a hora: dataRecepcao</text>
<line x1="340.0" y1="304" x2="340.0" y2="328" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="40" y="336" rx="14" ry="14" width="600" height="100" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><circle cx="66" cy="362" r="15" fill="#6366f1"/><text x="66" y="367" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial">3</text><text x="92" y="366" font-size="17" font-weight="700" fill="#0f172a" font-family="Arial">RECEBIMENTO · Etapa 2 — LABORATÓRIO</text><text x="92" y="388" font-size="13" fill="#475569" font-family="Arial">Designa as amostras → nº Histocell (sequencial)</text><text x="92" y="407" font-size="13" fill="#475569" font-family="Arial">Conferência previsto × recebido → sinaliza EXCEDENTE</text><text x="92" y="426" font-size="13" fill="#475569" font-family="Arial">Lança/confirma os serviços   grava a hora: dataRecebimento</text>
<line x1="340.0" y1="436" x2="340.0" y2="460" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="40" y="468" rx="14" ry="14" width="600" height="82" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/><circle cx="66" cy="494" r="15" fill="#22c55e"/><text x="66" y="499" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial">4</text><text x="92" y="498" font-size="17" font-weight="700" fill="#0f172a" font-family="Arial">ETIQUETAS</text><text x="92" y="520" font-size="13" fill="#475569" font-family="Arial">Gera e imprime etiqueta Code128 por lâmina/cassete</text><text x="92" y="539" font-size="13" fill="#475569" font-family="Arial">Nº impresso = nº do código de barras (scaneável)</text>
<line x1="340.0" y1="550" x2="340.0" y2="574" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="40" y="582" rx="14" ry="14" width="600" height="80" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><circle cx="66" cy="608" r="15" fill="#f59e0b"/><text x="66" y="613" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial">5</text><text x="92" y="612" font-size="17" font-weight="700" fill="#0f172a" font-family="Arial">RASTREIO POR DEPARTAMENTO (scan)</text><text x="92" y="634" font-size="13" fill="#475569" font-family="Arial">A peça anda escaneando Entrada/Saída em cada setor</text><text x="92" y="653" font-size="13" fill="#475569" font-family="Arial">Barra de progresso · responsável · tempo por etapa</text>
<rect x="40" y="686" rx="9" width="132" height="58" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
<text x="106.0" y="710" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">1. Recepção/</text>
<text x="106.0" y="725" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">Conferência</text>
<line x1="172" y1="715.0" x2="180" y2="715.0" stroke="#f59e0b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="182" y="686" rx="9" width="132" height="58" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
<text x="248.0" y="720" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">2. Macroscopia</text>
<line x1="314" y1="715.0" x2="322" y2="715.0" stroke="#f59e0b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="324" y="686" rx="9" width="132" height="58" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
<text x="390.0" y="710" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">3. Processamento/</text>
<text x="390.0" y="725" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">Inclusão</text>
<line x1="456" y1="715.0" x2="464" y2="715.0" stroke="#f59e0b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="466" y="686" rx="9" width="132" height="58" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
<text x="532.0" y="710" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">4. Microtomia</text>
<text x="532.0" y="725" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">(Corte)</text>
<rect x="40" y="778" rx="9" width="132" height="58" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
<text x="106.0" y="802" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">5. Coloração/</text>
<text x="106.0" y="817" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">Montagem</text>
<line x1="172" y1="807.0" x2="180" y2="807.0" stroke="#f59e0b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="182" y="778" rx="9" width="132" height="58" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
<text x="248.0" y="812" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">6. Laudo</text>
<line x1="314" y1="807.0" x2="322" y2="807.0" stroke="#f59e0b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="324" y="778" rx="9" width="132" height="58" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
<text x="390.0" y="812" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">7. Expedição</text>
<line x1="532.0" y1="744" x2="532.0" y2="776" stroke="#f59e0b" stroke-width="2" marker-end="url(#ah)"/>
<line x1="340.0" y1="866" x2="340.0" y2="888" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="40" y="896" rx="14" ry="14" width="600" height="70" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><circle cx="66" cy="922" r="15" fill="#16a34a"/><text x="66" y="927" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial">6</text><text x="92" y="926" font-size="17" font-weight="700" fill="#0f172a" font-family="Arial">EXPEDIÇÃO / CONCLUÍDO</text><text x="92" y="948" font-size="13" fill="#475569" font-family="Arial">Saída da Expedição encerra a peça (status: concluído)</text>
<rect x="680" y="100" rx="14" width="320" height="300" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="698" y="130" font-size="15" font-weight="700" fill="#0f172a">Financeiro</text>
<text x="698" y="158" font-size="13" fill="#475569">Crédito pré-pago abatido</text>
<text x="698" y="178" font-size="13" fill="#475569">automaticamente no</text>
<text x="698" y="198" font-size="13" fill="#475569">recebimento.</text>
<text x="698" y="218" font-size="13" fill="#475569"></text>
<text x="698" y="238" font-size="13" fill="#475569">Excedente (recebido &gt;</text>
<text x="698" y="258" font-size="13" fill="#475569">previsto) → sinalizado</text>
<text x="698" y="278" font-size="13" fill="#475569">para cobrança.</text>
<rect x="680" y="420" rx="14" width="320" height="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="698" y="450" font-size="15" font-weight="700" fill="#0f172a">Cliente (Portal)</text>
<text x="698" y="478" font-size="13" fill="#475569">Acompanha sem login:</text>
<text x="698" y="500" font-size="13" fill="#475569">· saldo de crédito</text>
<text x="698" y="522" font-size="13" fill="#475569">· histórico de pedidos</text>
<text x="698" y="544" font-size="13" fill="#475569">· status de cada pedido</text>
<text x="698" y="566" font-size="13" fill="#475569">· contato Histocell</text>
<rect x="680" y="660" rx="14" width="320" height="200" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="698" y="690" font-size="15" font-weight="700" fill="#0f172a">Relatório de tempos</text>
<text x="698" y="718" font-size="13" fill="#475569">Carimbo de tempo em:</text>
<text x="698" y="738" font-size="13" fill="#475569">Criado → Recepção →</text>
<text x="698" y="758" font-size="13" fill="#475569">Laboratório → (scan)</text>
<text x="698" y="778" font-size="13" fill="#475569">Processado → Despachado</text>
<text x="698" y="798" font-size="13" fill="#475569"></text>
<text x="698" y="818" font-size="13" fill="#475569">Cada scan grava o</text>
<text x="698" y="838" font-size="13" fill="#475569">responsável + hora.</text>
</svg>